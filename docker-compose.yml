services:
  db:
    image: mariadb:11.4
    container_name: kopi_karsa_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-us3r3982!}
      MYSQL_DATABASE: ${DB_NAME:-kopi_karsa}
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - kopi_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kopi_karsa_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://${DB_USER:-root}:${DB_PASSWORD:-us3r3982!}@db:3306/${DB_NAME:-kopi_karsa}"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_USER: "${DB_USER:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-us3r3982!}"
      DB_NAME: "${DB_NAME:-kopi_karsa}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kopi_network

volumes:
  mariadb_data:

networks:
  kopi_network:
    driver: bridge
